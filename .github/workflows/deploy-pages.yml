name: Déployer CaloriePhoto sur GitHub Pages

on:
  push:
    branches:
      - main
      - claude/calorie-calculator-photo-app-za8ybj
    paths:
      - "calorie-app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: calorie-app
      - id: deployment
        uses: actions/deploy-pages@v4
