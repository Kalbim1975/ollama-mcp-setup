<style>
/* Layout : appli mobile-first, barre haute collante, grille de fiches, fiche = une page en blocs */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#14213a; --muted:#5b6880; --line:#dde3ea;
  --accent:#1f6f8b; --accent-ink:#ffffff; --hl:#ffe27a; --danger:#c63a3a; --danger-bg:#fdecec;
  --ok:#2f855a; --ok-bg:#e8f5ee; --role-bg:#eaf3f7;
  --c-cardio:#d4493b; --c-pneumo:#2f9bb0; --c-neuro:#c2427e; --c-endo:#d9822b; --c-dig:#5f9e3f;
  --c-rea:#1f2d4a; --c-psy:#6670d4; --c-mat:#d36a9a; --c-ped:#c99a1c; --c-pharma:#7a4fd0; --c-nephro:#3f7f8c;
  --c-infectio:#8c5a3c; --c-hemato:#9b2c3f; --c-loco:#0e7c66; --c-fonda:#3e6fd8; --c-onco:#7a4f8c;
  --body:#e9eef3; --organ:#a9b7c7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --surface:#18202e; --ink:#e8edf5; --muted:#9aa7bc; --line:#2a3446;
  --accent:#5cb8d6; --accent-ink:#0b1420; --hl:#7a6420; --danger:#ff7b7b; --danger-bg:#3a1e22;
  --ok:#6fd39c; --ok-bg:#183326; --role-bg:#1b2d3a; --c-rea:#8ea2c9; --c-loco:#3fbf9f; --body:#222c3c; --organ:#4d5d78; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#18202e; --ink:#e8edf5; --muted:#9aa7bc; --line:#2a3446;
  --accent:#5cb8d6; --accent-ink:#0b1420; --hl:#7a6420; --danger:#ff7b7b; --danger-bg:#3a1e22;
  --ok:#6fd39c; --ok-bg:#183326; --role-bg:#1b2d3a; --c-rea:#8ea2c9; --c-loco:#3fbf9f; --body:#222c3c; --organ:#4d5d78; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.logo span{color:var(--accent)}
nav.tabs{display:flex;gap:6px;margin-left:auto}
.tab{font:inherit;font-size:.9rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.hero{padding-block:28px 8px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c-cardio);font-weight:700}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.1;margin-top:6px;font-weight:800}
.hero h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
.hero p{color:var(--muted);max-width:60ch;margin:10px 0 0}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:1.1rem}
.search{margin-top:18px;position:relative}
.search input{width:100%;font:inherit;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font:inherit;font-size:.9rem;font-weight:700;border:2px solid var(--c,var(--muted));background:transparent;color:var(--c,var(--ink));padding:5px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-block:20px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;position:relative}
.card:hover{border-color:var(--c)}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--c);padding:2px 8px;border-radius:6px;align-self:flex-start}
.card h3{font-size:1.1rem}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.card .marks{position:absolute;top:12px;right:14px;display:flex;gap:4px;font-size:.8rem}
.dot-ok{color:var(--ok)} .dot-fav{color:var(--c-endo)}
.empty{grid-column:1/-1;color:var(--muted);padding:30px 0;text-align:center}
/* fiche */
.fiche{padding-block:18px 48px}
.back{font:inherit;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:700}
.fhead{border-top:6px solid var(--c);background:var(--surface);border-radius:var(--r);padding:18px;margin-top:10px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fhead h2{font-size:clamp(1.5rem,4vw,2.1rem);margin-top:8px;font-weight:800}
.fhead .sub{color:var(--muted);margin-top:2px}
.oneline{margin-top:14px;background:var(--bg);border-radius:10px;padding:10px 12px}
.oneline b{font-family:var(--f-display);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c);display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-size:.9rem;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.blk h3{font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.blk h3 .n{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:.8rem}
.blk ul{margin:0;padding-left:18px} .blk li{margin:3px 0}
.blk.wide{grid-column:1/-1}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span.step{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.92rem}
.flow span.arr{color:var(--c);font-weight:700}
.blk.role{background:var(--role-bg);border-color:var(--accent)}
.blk.role h3{color:var(--accent)}
.blk.alert{background:var(--danger-bg);border-color:var(--danger)}
.blk.alert h3{color:var(--danger)}
.qbox{border:2px dashed var(--c);background:var(--surface)}
.reveal{margin-top:10px}
.answer{margin-top:10px;background:var(--ok-bg);border-radius:10px;padding:10px 12px}
.note{font-size:.8rem;color:var(--muted);margin-top:18px;max-width:70ch}
/* quiz */
.quiz{padding-block:24px 48px;max-width:640px;margin:0 auto}
.qcard{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:var(--r);padding:20px;margin-top:14px}
.qcard h2{font-size:1.25rem;margin-top:8px}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;margin-top:14px;font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn.good{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:16px;align-items:start}
.map{margin:0;text-align:center}
.map svg{width:100%;max-width:130px;height:auto;display:block;margin:0 auto}
.map figcaption{font-size:.75rem;color:var(--muted);margin-top:4px;line-height:1.3}
.map figcaption b{color:var(--c);display:block;font-size:.8rem}
.bd{fill:var(--body);stroke:var(--line);stroke-width:1.5}
.skin-on .bd,.bd.leg-on{fill:color-mix(in srgb,var(--c) 22%,var(--body));stroke:var(--c)}
.org{fill:var(--organ)}
.org.on{fill:var(--c);stroke:var(--surface);stroke-width:1.5}
.vs path{fill:none;stroke:var(--organ);stroke-width:2;stroke-linecap:round;opacity:.6}
.vs.on path{stroke:var(--c);stroke-width:3;opacity:1}
.vein path{stroke-width:0}.vein.on path{stroke-width:5}
.pin circle{fill:var(--c);stroke:var(--surface);stroke-width:2}
.mini{width:44px;height:88px;flex:none}
.card .row{display:flex;gap:10px;align-items:flex-start}
.card .row>div{min-width:0;display:flex;flex-direction:column;gap:6px}
/* impression PDF */
.print-cover{display:flex;flex-direction:column;gap:12px;padding-top:70mm!important}
.print-cover h1{font-size:44px;font-weight:800}
.toc{columns:3;column-gap:22px;font-size:10.5px;line-height:1.35;margin-top:14px}
.toc div{break-inside:avoid;margin-bottom:10px}
.toc b{font-family:var(--f-display);display:block;margin-bottom:2px}
body.printing{font-size:10.5px;line-height:1.38;background:#fff}
body.printing .fgrid{grid-template-columns:minmax(0,1fr) 84px}
body.printing .fhead{padding:12px 14px}
body.printing .fhead h2{font-size:24px}
body.printing .blk li{margin:1px 0}
body.printing .blk h3{margin-bottom:4px;font-size:12px}
body.printing .oneline{margin-top:8px;padding:7px 10px}
body.printing .blocks{margin-top:8px}
body.printing header.top,body.printing::before,body.printing .back,body.printing .actions,body.printing .reveal{display:none!important}
body.printing .answer[hidden]{display:block!important}
body.printing .wrap{max-width:none;padding:0}
body.printing .fiche{padding:0;break-after:page}
body.printing .blk{padding:8px 11px}
body.printing .blocks{gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
body.printing .note{display:none}
body.printing a[href="#doses"]{display:none}
body.printing .flow span.step{font-size:10.5px;padding:3px 8px}
body.printing .map svg{max-width:70px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;padding-top:16px}
.subtabs .tab{text-decoration:none;display:inline-block}
.subtabs .smur{border-style:dashed}
@media (max-width:640px){.fgrid{grid-template-columns:minmax(0,1fr) 92px;gap:10px}.blocks{grid-template-columns:minmax(0,1fr)} nav.tabs{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const CATS={
  cardio:{n:"Cardio",c:"--c-cardio"},pneumo:{n:"Pneumo",c:"--c-pneumo"},neuro:{n:"Neuro",c:"--c-neuro"},
  endo:{n:"Endocrino",c:"--c-endo"},dig:{n:"Digestif",c:"--c-dig"},nephro:{n:"Néphro",c:"--c-nephro"},
  rea:{n:"Réa",c:"--c-rea"},psy:{n:"Psy",c:"--c-psy"},mat:{n:"Maternité",c:"--c-mat"},
  ped:{n:"Pédiatrie",c:"--c-ped"},pharma:{n:"Pharmaco",c:"--c-pharma"},
  infectio:{n:"Infectio",c:"--c-infectio"},
  onco:{n:"Onco",c:"--c-onco"},hemato:{n:"Hémato",c:"--c-hemato"},loco:{n:"Locomoteur",c:"--c-loco"},fonda:{n:"Fondamentaux",c:"--c-fonda"}
};
const F=[
{id:"sca",cat:"cardio",t:"Infarctus du myocarde (SCA ST+)",s:"Syndrome coronarien aigu avec sus-décalage du segment ST",
one:"Une artère coronaire se bouche brutalement (caillot sur une plaque d'athérome) : le muscle cardiaque qu'elle nourrit meurt si on ne la débouche pas vite.",
meca:["Plaque d'athérome","Rupture de la plaque","Caillot qui bouche la coronaire","Ischémie puis nécrose du myocarde"],
signes:["Douleur rétrosternale constrictive (« en étau »), > 20 min","Irradiation bras gauche, mâchoire, dos","Résiste à la trinitrine","Sueurs, nausées, angoisse, dyspnée","Formes atypiques : femme, diabétique, sujet âgé"],
exam:["ECG 18 dérivations dans les 10 min : sus-décalage ST","Troponine (cinétique)","Coronarographie"],
ttt:["Reperfusion urgente : angioplastie (idéalement < 120 min) ou thrombolyse","Aspirine + 2e antiagrégant (inhibiteur P2Y12) + anticoagulant","Morphine si douleur ; O2 seulement si SpO2 < 90 %","Au long cours : bêtabloquant, IEC, statine, arrêt du tabac"],
role:["Faire l'ECG immédiatement, alerter le médecin","Scope, PA, SpO2, VVP, bilan sanguin (troponine)","Évaluer la douleur (EVA) et la tracer","Repos strict, rassurer","Pas d'injection IM (risque hémorragique si thrombolyse)","Surveiller point de ponction après coronarographie"],
alert:["Troubles du rythme (FV : 1re cause de décès précoce)","Signes de choc cardiogénique","Récidive de la douleur"],
q:{q:"Pourquoi faut-il faire l'ECG en moins de 10 minutes ?",a:"Parce que « le temps c'est du muscle » : le sus-décalage ST pose l'indication d'une reperfusion urgente. Chaque minute de retard augmente la zone de nécrose."}},
{id:"ic",cat:"cardio",t:"Insuffisance cardiaque",s:"Le cœur ne pompe plus assez pour couvrir les besoins",
one:"Le cœur devient une pompe fatiguée : le sang stagne en amont (poumons à gauche, corps à droite) et l'eau s'accumule.",
meca:["Cœur abîmé (infarctus, HTA, valve…)","Débit insuffisant","Stase en amont","Œdèmes (poumon ou jambes)"],
signes:["Gauche : dyspnée d'effort puis orthopnée, toux, crépitants, OAP","Droite : œdèmes des membres inférieurs, turgescence jugulaire, hépatomégalie douloureuse","Prise de poids rapide, fatigue"],
exam:["BNP / NT-proBNP élevé","Échographie cardiaque (FEVG)","Radio thorax, ECG, ionogramme, créatinine"],
ttt:["Diurétiques de l'anse (furosémide) si surcharge","IEC/ARA2 ou sacubitril-valsartan, bêtabloquant, antialdostérone, iSGLT2","Régime pauvre en sel","Traiter la cause"],
role:["Pesée quotidienne : même heure, même balance, même tenue","Bilan entrées/sorties, diurèse","Position demi-assise si dyspnée","Surveiller kaliémie et créatinine (diurétiques, IEC)","Éducation : alerter si +2 kg en 3 jours, essoufflement inhabituel"],
alert:["OAP : dyspnée brutale, grésillement, mousse rosée, sueurs","Hypotension, confusion"],
q:{q:"Quel est le geste de surveillance le plus simple pour détecter une décompensation ?",a:"La pesée quotidienne dans les mêmes conditions : une prise de poids rapide (+2 kg en 3 jours) signe une rétention d'eau avant même les symptômes."}},
{id:"hta",cat:"cardio",t:"Hypertension artérielle",s:"Pression trop élevée dans les artères, en permanence",
one:"La pression du sang est trop forte en continu ; c'est silencieux mais ça abîme cœur, cerveau, reins et yeux.",
meca:["Pression élevée chronique","Artères qui s'épaississent","Atteinte des organes cibles","AVC, infarctus, insuffisance rénale"],
signes:["Souvent aucun symptôme","Parfois céphalées, acouphènes, phosphènes","Seuil : ≥ 140/90 mmHg au cabinet, à confirmer hors cabinet (automesure ≥ 135/85)"],
exam:["Automesure (règle des 3 : 3 mesures matin et soir, 3 jours) ou MAPA","Créatinine, kaliémie, bandelette urinaire, ECG, bilan lipidique, glycémie"],
ttt:["Règles hygiéno-diététiques : moins de sel, activité physique, perte de poids, moins d'alcool","Antihypertenseurs : IEC/ARA2, inhibiteurs calciques, diurétiques thiazidiques"],
role:["Mesurer la PA correctement : patient au repos 5 min, brassard adapté, bras à hauteur du cœur","Apprendre l'automesure","Vérifier l'observance","Surveiller hypotension orthostatique"],
alert:["PA très élevée + douleur thoracique, déficit neuro, troubles visuels : urgence hypertensive"],
q:{q:"Pourquoi appelle-t-on l'HTA un « tueur silencieux » ?",a:"Elle est le plus souvent asymptomatique pendant des années alors qu'elle abîme progressivement les organes cibles ; on la découvre souvent au stade de complication."}},
{id:"bpco",cat:"pneumo",t:"BPCO",s:"Bronchopneumopathie chronique obstructive",
one:"Les bronches sont abîmées durablement (le tabac surtout) : l'air sort mal et l'obstruction ne revient pas à la normale.",
meca:["Tabac / toxiques inhalés","Inflammation chronique des bronches","Obstruction non réversible","Distension, emphysème"],
signes:["Toux et crachats chroniques","Dyspnée d'effort qui s'aggrave","Exacerbations (souvent infectieuses)","Tardif : distension thoracique, cyanose"],
exam:["Spirométrie : VEMS/CVF < 0,70 après bronchodilatateur","Gaz du sang si exacerbation","Radio thorax"],
ttt:["Arrêt du tabac (le seul qui freine l'évolution)","Bronchodilatateurs de longue durée inhalés","Réhabilitation respiratoire, vaccinations","Oxygénothérapie de longue durée si hypoxémie sévère"],
role:["Vérifier la technique d'inhalation","O2 au débit prescrit : cible souvent SpO2 88-92 %","Surveiller FR, SpO2, conscience (somnolence = hypercapnie)","Aide au sevrage tabagique","Position demi-assise, kiné respiratoire"],
alert:["Somnolence, sueurs, céphalées : hypercapnie","Signes de lutte, cyanose, confusion"],
q:{q:"Pourquoi ne pas donner trop d'O2 à un patient BPCO hypercapnique ?",a:"Un apport excessif peut aggraver l'hypercapnie (troubles de la ventilation/perfusion, baisse de la commande ventilatoire). On vise une SpO2 prescrite, souvent 88-92 %."}},
{id:"asthme",cat:"pneumo",t:"Asthme",s:"Inflammation chronique des bronches avec crises réversibles",
one:"Les bronches sont sensibles et se resserrent par crises (spasme + inflammation + mucus), mais c'est réversible.",
meca:["Facteur déclenchant (allergène, effort, froid, infection)","Bronchospasme + inflammation","Obstruction réversible","Crise"],
signes:["Dyspnée sifflante, surtout expiratoire","Toux nocturne, oppression thoracique","Sibilants à l'auscultation","Gravité : parle par mots, FR > 30, DEP < 50 %, silence auscultatoire"],
exam:["Spirométrie avec réversibilité","Débit expiratoire de pointe (DEP)","Bilan allergologique"],
ttt:["Crise : bronchodilatateur de courte durée (salbutamol) inhalé ou nébulisé","Corticoïdes oraux si crise sévère","Fond : corticoïdes inhalés (± bronchodilatateur longue durée)","Éviction des facteurs déclenchants"],
role:["Position assise, calmer","Mesurer DEP, SpO2, FR","Nébulisation selon prescription","Éducation : chambre d'inhalation, plan d'action écrit","Faire rincer la bouche après corticoïde inhalé (mycose)"],
alert:["Silence auscultatoire","Épuisement, troubles de conscience, cyanose"],
q:{q:"Que signifie un « silence auscultatoire » pendant une crise ?",a:"Une crise très grave : l'air ne passe presque plus, donc il n'y a même plus de sibilants. Urgence vitale."}},
{id:"ep",cat:"pneumo",t:"Embolie pulmonaire",s:"Un caillot migre et bouche une artère pulmonaire",

const KEY="soignote-v1";
let store={fav:[],done:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.fav))store=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const toggle=(arr,id)=>{const i=store[arr].indexOf(id);i<0?store[arr].push(id):store[arr].splice(i,1);save()};

let state={view:"list",cat:null,q:""};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=cat=>`var(${CATS[cat].c})`;
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

function setTabs(v){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===v)))}

function cardHTML(f){
  const fav=store.fav.includes(f.id),done=store.done.includes(f.id);
  return `<button class="card" style="--c:${col(f.cat)}" data-id="${f.id}">
    <span class="marks">${fav?'<span class="dot-fav" title="Favori">★</span>':""}${done?'<span class="dot-ok" title="Révisée">✓</span>':""}</span>
    <span class="row"><span class="mini">${bodyMap(zonesOf(f))}</span><div><span class="tag">${CATS[f.cat].n}</span><h3>${esc(f.t)}</h3><p>${esc(f.one)}</p></div></span></button>`;
}

  const usedCats=[...new Set(F.map(f=>f.cat))];
  app.innerHTML=`

let quiz=null;
function startQuiz(){
  const deck=F.map(f=>f.id).sort(()=>Math.random()-.5);
  quiz={deck,i:0,ok:0,shown:false};
}
function renderQuiz(){
  if(!quiz)startQuiz();
  const {deck,i,ok}=quiz;
  if(i>=deck.length){
    app.innerHTML=`<section class="quiz"><div class="eyebrow">Quiz terminé</div><h1 style="font-size:2rem;margin-top:6px">${ok} / ${deck.length} réponses sues</h1>
      <p style="color:var(--muted)">Les fiches réussies sont marquées « révisées ». Reprends celles qui t'ont posé problème.</p>
      <div class="btnrow"><button class="btn primary" id="again">Recommencer</button></div></section>`;
    document.getElementById("again").onclick=()=>{startQuiz();renderQuiz()};return;
  }
  const f=F.find(x=>x.id===deck[i]);
  app.innerHTML=`<section class="quiz">
    <div class="eyebrow">Questions de partiel</div>
    <div class="progress" aria-hidden="true"><i style="width:${i/deck.length*100}%"></i></div>
    <div class="qmeta"><span>Question ${i+1} / ${deck.length}</span><span>${ok} sues</span></div>
    <div class="qcard" style="--c:${col(f.cat)}"><span class="tag">${CATS[f.cat].n} · ${esc(f.t)}</span>
      <h2>${esc(f.q.q)}</h2>
      ${quiz.shown?`<div class="answer">${esc(f.q.a)}</div>
        <div class="btnrow"><button class="btn good" id="yes">Je savais</button><button class="btn bad" id="no">À revoir</button><button class="btn" id="see">Ouvrir la fiche</button></div>`
      :`<div class="btnrow"><button class="btn primary" id="show">Voir la réponse</button></div>`}
    </div></section>`;
  const next=good=>{if(good){quiz.ok++;if(!store.done.includes(f.id)){store.done.push(f.id);save()}}quiz.i++;quiz.shown=false;renderQuiz()};
  if(quiz.shown){document.getElementById("yes").onclick=()=>next(true);document.getElementById("no").onclick=()=>next(false);document.getElementById("see").onclick=()=>openFiche(f.id)}
  else document.getElementById("show").onclick=()=>{quiz.shown=true;renderQuiz()};
}

    {k:'r5', l:'5 mg/kg/h (ml/h)', v:[25,30,35,40,45,50]} ]}

function compute(id, w, o){
  if(id==='keppra'){
    const raw=60*w, dose=Math.min(raw,4500), vol=dose/100;
    return {raw,dose,capped:raw>4500,vol,flacons:ceilQ(dose/500),cols:{dose,vol}};
  }
  if(id==='depakine'){
    const raw=40*w, dose=Math.min(raw,3000), vol=dose/100;
    return {raw,dose,capped:raw>3000,vol,flacons:ceilQ(dose/400),nacl:50-vol,cols:{dose,vol}};
  }
  if(id==='gardenal'){
    const raw=15*w, dose=Math.min(raw,1200), vol=dose/20, fl=ceilQ(dose/200);
    return {raw,dose,capped:raw>1200,vol,flacons:fl,eppi:fl*10,nacl:60-vol,mgmin:dose/20,cols:{dose,vol,fl}};
  }
  if(id==='induction'){
    const f=o.half?0.5:1, dose=o.mgkg*w*f, lo=1.5*w*f, hi=2.5*w*f;
    return {f,dose,ml:dose/25,lo,hi,loMl:lo/25,hiMl:hi/25,cols:{b15:lo/25,b25:hi/25}};
  }
  const rate=o.mgkgh*w/10, mgh=o.mgkgh*w;
  return {rate,mgh,hours:50/rate,cols:{r2:2*w/10,r3:3*w/10,r4:4*w/10,r5:5*w/10}};
}
function matchIdx(t,w){
  const i=t.w.findIndex(x=>Math.abs(x-w)<1e-9);
  if(i>=0) return i;
  if(t.openLast && w>=t.w[t.w.length-1]) return t.w.length-1;
  return -1;
}
function outOfRange(t,w){ return w<t.min || (t.max!==null && w>t.max); }
function check(id,w,res,f){
  const t=T[id], idx=matchIdx(t,w);
  if(idx<0) return {status:'none'};
  const bad=[];
  t.rows.forEach(r=>{
    const exp=r.v[idx]*(r.scale?f:1), got=res.cols[r.k];
    if(Math.abs(exp-got)>0.061) bad.push({row:r.l,exp,got});
  });
  return {status:bad.length?'diff':'ok',idx,bad};
}
// END-CALC

function parseW(){

}

}

  const rows=t.rows.map(r=>`<tr><th scope="row">${r.l}</th>${r.v.map((v,i)=>`<td class="${i===idx?'hit':''}">${nf.format(v)}</td>`).join('')}</tr>`).join('');
  return `<div class="ficheT"><h3>Tableau de la fiche</h3><div class="scroll"><table><thead><tr><th scope="col">Poids (kg)</th>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

  const out=$('out'), w=parseW();

  if(w===null){ out.innerHTML='<div class="empty">Saisissez un poids valide, en kilogrammes.</div>'; return; }

  const id=state.id, res=compute(id,w,state), v=VIEW[id](res,w,state);
  const fct=id==='induction'?res.f:1;
  const chk=check(id,w,res,fct), t=T[id];

  const alerts=[];
  if(w<40) alerts.push(['bad',`Poids inférieur à 40 kg. Ces fiches concernent l'adulte. Vérifier le poids et la posologie avec le médecin.`]);
  else if(w>200) alerts.push(['warn','Poids supérieur à 200 kg. Vérifier la saisie.']);
  v.alerts.forEach(a=>alerts.push(a));

  if(chk.status==='ok') alerts.push(['ok',`Résultat identique à la fiche pour ${f(w)} kg.`]);
  else if(chk.status==='diff') alerts.push(['bad',`Écart avec le tableau de la fiche : ${chk.bad.map(b=>`${b.row} calculé ${f(b.got)}, fiche ${f(b.exp)}`).join(' ; ')}. Ne pas utiliser sans vérifier.`]);
  else if(outOfRange(t,w)) alerts.push(['warn',`Poids hors du tableau de la fiche (${t.min}${t.max?` à ${t.max} kg`:' kg et plus'}). Valeurs calculées par la formule, à vérifier.`]);
  else alerts.push(['plain','Poids intermédiaire, absent du tableau de la fiche. Valeurs calculées par la formule.']);

  out.innerHTML=`
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="hero"><span class="label-caps">${v.heroLabel}</span><span class="big">${v.big}<small>${v.unit}</small></span><span class="formula">${v.formula}</span></div>
      <dl class="metrics">${v.metrics.map(m=>`<div><dt>${m[0]}</dt><dd>${m[1]}${m[2]?`<small>${m[2]}</small>`:''}</dd></div>`).join('')}</dl>

      <div class="alerts">${alerts.map(a=>`<div class="alert ${a[0]}">${a[1]}</div>`).join('')}</div>
      ${tableHtml(id,w,chk.idx===undefined?-1:chk.idx)}
    </div>`;
}

const CI_CSS=" .dzroot {\n  --bg: #f2f5f4; --surface: #ffffff; --raised: #f8faf9; --ink: #10201c; --muted: #5b6c68; --line: #d9e2df;\n  --accent: #0b6b5c; --accent-ink: #ffffff; --accent-soft: #e0f0eb; --accent-text: #0a5c4f;\n  --warn-bg: #fff3d4; --warn: #774f00; --danger: #b42318; --danger-soft: #fde8e6; --ok-soft: #dcf2ea; --ok: #0d6a4f;\n  --mark: rgba(255, 190, 0, .24); --shadow: 0 1px 2px rgba(16, 32, 28, .06), 0 4px 14px rgba(16, 32, 28, .05);\n  --f-body: \"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --f-head: \"IBM Plex Sans Condensed\", \"Arial Narrow\", system-ui, sans-serif;\n  --f-num: \"IBM Plex Mono\", ui-monospace, Menlo, Consolas, monospace;\n  --nav-h: 64px;\n}\n@media (prefers-color-scheme: dark) {\n  .dzroot:not([data-theme=\"light\"]) {\n    --bg: #0c1412; --surface: #141f1c; --raised: #1a2724; --ink: #e5eeeb; --muted: #95a8a3; --line: #263531;\n    --accent: #38c6a4; --accent-ink: #062019; --accent-soft: #123a31; --accent-text: #62d9bb;\n    --warn-bg: #3a2d0e; --warn: #ffd57a; --danger: #ff7a6b; --danger-soft: #3d1a17; --ok-soft: #123a2e; --ok: #6fdcb6;\n    --mark: rgba(255, 190, 0, .28); --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;\n  }\n}\n.dzroot[data-theme=\"dark\"] {\n  --bg: #0c1412; --surface: #141f1c; --raised: #1a2724; --ink: #e5eeeb; --muted: #95a8a3; --line: #263531;\n  --accent: #38c6a4; --accent-ink: #062019; --accent-soft: #123a31; --accent-text: #62d9bb;\n  --warn-bg: #3a2d0e; --warn: #ffd57a; --danger: #ff7a6b; --danger-soft: #3d1a17; --ok-soft: #123a2e; --ok: #6fdcb6;\n  --mark: rgba(255, 190, 0, .28); --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;\n}\n* { box-sizing: border-box; }\n[hidden]{display:none!important}\n.dzroot { --f-body: \"Atkinson Hyperlegible\", system-ui, sans-serif; --f-head: \"Bricolage Grotesque\", system-ui, sans-serif; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); padding-block: 16px 40px; }\n.dzroot h1 { margin: 0 \n.res.err { background: var(--warn-bg); }\n.res.err strong { font: 600 15px var(--f-body); color: var(--warn); }\n.res:empty::before { content: \"Le résultat s'affiche ici.\"; color: var(--muted); font-size: 13px; }";

\"u\">mL<\/span><\/div>\n    <div class=\"res\"><\/div>\n  <\/section>\n\n  <section class=\"calc\" id=\"c4\">\n    <h2><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M7 2h10v7a5 5 0 01-10 0z\"/><path d=\"M12 14v3M12 20h.01M12 22h.01\"/><\/svg>Débit de perfusion<\/h2>\n    <p class=\"help\">Volume à passer et durée.<\/p>\n    <div class=\"row\"><label for=\"c4-vol\">Volume à perfuser<\/label><input id=\"c4-vol\" inputmode=\"decimal\" data-k=\"vol\"><span class=\"u\">mL<\/span><\/div>\n    <div class=\"row\"><label for=\"c4-h\">Durée<\/label><input id=\"c4-h\" inputmode=\"decimal\" data-k=\"h\" aria-label=\"Heures\"><span class=\"u\">h<\/span><input id=\"c4-min\" inputmode=\"decimal\" data-k=\"min\" aria-label=\"Minutes\"><span class=\"u\">min<\/span><\/div>\n    <div class=\"row\"><label for=\"c4-gtt\">Perfuseur<\/label><select id=\"c4-gtt\" data-k=\"gtt\">\n      <option value=\"20\">Standard : 20 gouttes/mL<\/option><option value=\"15\">Transfuseur : 15 gouttes/mL<\/option><option value=\"60\">Métrique pédiatrique : 60 gouttes/mL<\/option><\/select><\/div>\n    <div class=\"res\"><\/div>\n  <\/section>\n\n  <section class=\"calc\" id=\"c5\">\n    <h2><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><\/svg>Score de Glasgow<\/h2>\n    <p class=\"help\">Meilleure réponse pour chaque item.<\/p>\n    <div class=\"row\"><label for=\"c5-y\">Ouverture des yeux (Y)<\/label><select id=\"c5-y\" data-k=\"y\"><option value=\"4\">4 · spontanée<\/option><option value=\"3\">3 · au bruit<\/option><option value=\"2\">2 · à la douleur<\/option><option value=\"1\">1 · nulle<\/option><\/select><\/div>\n    <div class=\"row\"><label for=\"c5-v\">Réponse verbale (V)<\/label><select id=\"c5-v\" data-k=\"v\"><option value=\"5\">5 · orientée<\/option><option value=\"4\">4 · confuse<\/option><option value=\"3\">3 · inappropriée<\/option><option value=\"2\">2 · incompréhensible<\/option><option value=\"1\">1 · nulle<\/option><\/select><\/div>\n    <div class=\"row\"><label for=\"c5-m\">Réponse motrice (M)<\/label><select id=\"c5-m\" data-k=\"m\"><option value=\"6\">6 · aux ordres<\/option><option value=\"5\">5 · orientée<\/option><option value=\"4\">4 · évitement<\/option><option value=\"3\">3 · flexion stéréotypée<\/option><option value=\"2\">2 · extension stéréotypée<\/option><option value=\"1\">1 · nulle<\/option><\/select><\/div>\n    <div class=\"res\"><\/div>\n  <\/section>\n\n  <section class=\"calc\" id=\"c6\">\n    <h2><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"7\" y=\"6\" width=\"10\" height=\"16\" rx=\"4\"/><path d=\"M10 2h4v4h-4z\"/><\/svg>Autonomie d'une bouteille d'O<sub>2<\/sub><\/h2>\n    <p class=\"help\">Pression × volume ÷ débit, moins 10 % de sécurité.<\/p>\n    <div class=\"row\"><label for=\"c6-bar\">Pression lue<\/label><input id=\"c6-bar\" inputmode=\"decimal\" data-k=\"bar\" value=\"200\"><span class=\"u\">bar<\/span><\/div>\n    <div class=\"row\"><label for=\"c6-vb\">Volume de la bouteille<\/label><select id=\"c6-vb\" data-k=\"vb\"><option value=\"5\">B5 · 5 L<\/option><option value=\"2\">B2 · 2 L<\/option><option value=\"15\">B15 · 15 L<\/option><\/select><\/div>\n    <div class=\"row\"><label for=\"c6-deb\">Débit d'O<sub>2<\/sub><\/label><input id=\"c6-deb\" inputmode=\"decimal\" data-k=\"deb\" value=\"6\"><span class=\"u\">L/min<\/span><\/div>\n    <div class=\"res\"><\/div>\n  <\/section>\n  <\/div>";
function CI_INIT(sh){
const $ = (s, r = sh) => r.querySelector(s);
const UNITS = { 'g': ['m', 1000], 'mg': ['m', 1], 'µg': ['m', 0.001], 'UI': ['u', 1], 'millions UI': ['u', 1e6] };
sh.querySelectorAll('select[data-k="udose"], select[data-k="uqte"]').forEach((s) => {
  for (const u of Object.keys(UNITS)) s.add(new Option(u, u));
  s.value = 'mg';
});
const num = (v) => { const x = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(x) ? x : NaN; };
const fmt = (x) => {
  const a = Math.abs(x);
  return x.toLocaleString('fr-FR', { maximumFractionDigits: a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3 });
};
// Meilleure unité de masse pour l'affichage (valeur en mg)
const mass = (mg) => mg >= 1000 ? fmt(mg / 1000) + ' g' : mg >= 1 ? fmt(mg) + ' mg' : fmt(mg * 1000) + ' µg';
const qtyText = (v, fam) => fam === 'm' ? mass(v) : fmt(v) + ' UI';

function calc(id, fn) {
  const box = $('#' + id), res = $('.res', box);
  const run = () => {
    const v = {};
    box.querySelectorAll('[data-k]').forEach((el) => { v[el.dataset.k] = el.value; });
    let out;
    try { out = fn(v, box); } catch (e) { out = { err: e.message }; }
    res.className = 'res' + (out && out.err ? ' err' : '');
    res.textContent = '';
    if (!out) return;
    const s = document.createElement('strong'); s.textContent = out.err || out.main; res.append(s);
    for (const line of out.lines || []) { const sm = document.createElement('small'); sm.textContent = line; res.append(sm); }
  };
  box.addEventListener('input', run); box.addEventListener('change', run); run();
}
const need = (...xs) => xs.some((x) => isNaN(x));
const positive = (...xs) => { if (xs.some((x) => x <= 0)) throw new Error('Les valeurs doivent être supérieures à 0.'); };
function sameFamily(u1, u2) {
  if (UNITS[u1][0] !== UNITS[u2][0]) throw new Error('Unités incompatibles : masse (g, mg, µg) et UI ne se convertissent pas.');
  return UNITS[u1][0];
}

const fVol = (v) => {
  const d = num(v.dose), q = num(v.qte), vol = num(v.vol);
  if (need(d, q, vol)) return null;
  positive(d, q, vol);
  const fam = sameFamily(v.udose, v.uqte);
  const dose = d * UNITS[v.udose][1], conc = q * UNITS[v.uqte][1] / vol, ml = dose / conc;
  return { main: fmt(ml) + ' mL à prélever', lines: [
    'Concentration : ' + qtyText(conc, fam) + '/mL',
    'Calcul : ' + qtyText(dose, fam) + ' ÷ ' + qtyText(conc, fam) + '/mL = ' + fmt(ml) + ' mL',
    ml > vol ? 'Attention : ce volume dépasse une ampoule (' + fmt(ml / vol) + ' ampoules ou flacons).' : '' ].filter(Boolean) };
};
calc('c1', fVol);

calc('c2', (v) => {
  const q = num(v.qte), vm = num(v.vmed), vf = num(v.vfin);
  if (need(q, vf)) return null;
  positive(q, vf);
  const fam = UNITS[v.uqte][0], conc = q * UNITS[v.uqte][1] / vf;
  const lines = ['Calcul : ' + qtyText(q * UNITS[v.uqte][1], fam) + ' ÷ ' + fmt(vf) + ' mL'];
  if (!isNaN(vm)) {
    if (vm < 0 || vm > vf) throw new Error('Le volume du médicament doit être compris entre 0 et le volume final.');
    lines.unshift('Solvant à ajouter : ' + fmt(vf - vm) + ' mL (' + fmt(vf) + ' − ' + fmt(vm) + ')');
  }
  return { main: qtyText(conc, fam) + '/mL', lines };
});

const fSap = (v, box) => {
  const [unit, per, kg] = v.uposo.split('|');
  if (box) $('[data-poids]', box).style.display = kg === '1' ? '' : 'none';
  const p = num(v.poso), q = num(v.qte), vol = num(v.vol), w = kg === '1' ? num(v.poids) : 1;
  if (need(p, q, vol, w)) return null;
  positive(p, q, vol, w);
  const fam = sameFamily(unit, v.uqte);
  const perHour = p * UNITS[unit][1] * w * (per === 'min' ? 60 : 1);
  const conc = q * UNITS[v.uqte][1] / vol, rate = perHour / conc;
  return { main: fmt(rate) + ' mL/h', lines: [
    'Dose horaire : ' + qtyText(perHour, fam) + '/h',
    'Concentration de la seringue : ' + qtyText(conc, fam) + '/mL',
    'Calcul : ' + qtyText(perHour, fam) + '/h ÷ ' + qtyText(conc, fam) + '/mL = ' + fmt(rate) + ' mL/h',
    'Autonomie de la seringue : ' + fmt(vol / rate) + ' h' ] };
};
calc('c3', fSap);

const fPerf = (v) => {
  const vol = num(v.vol), h = v.h === '' ? 0 : num(v.h), m = v.min === '' ? 0 : num(v.min);
  if (need(vol, h, m) || (v.h === '' && v.min === '')) return null;
  const hours = h + m / 60;
  positive(vol, hours);
  const rate = vol / hours, g = +v.gtt, gpm = vol * g / (hours * 60);
  return { main: fmt(rate) + ' mL/h', lines: [
    Math.round(gpm) + ' gouttes/min (' + g + ' gouttes/mL), soit 1 goutte toutes les ' + fmt(60 / gpm) + ' s',
    'Calcul : ' + fmt(vol) + ' mL ÷ ' + fmt(hours) + ' h ; ' + fmt(vol) + ' × ' + g + ' ÷ ' + fmt(hours * 60) + ' min' ] };
};
calc('c4', fPerf);

calc('c5', (v) => {
  const t = +v.y + +v.v + +v.m;
  return { main: 'GCS ' + t + ' / 15', lines: ['Y' + v.y + ' V' + v.v + ' M' + v.m,
    t <= 8 ? 'GCS ≤ 8 : coma grave, protection des voies aériennes à discuter.' : t <= 12 ? 'Altération modérée de la conscience.' : 'Altération légère ou conscience normale.'] };
});
calc('c6', (v) => {
  const b = num(v.bar), d = num(v.deb), vb = +v.vb;
  if (need(b, d)) return null;
  positive(b, d);
  const min = b * vb / d * 0.9;
  const hh = Math.floor(min / 60), mm = Math.round(min % 60);
  return { main: (hh ? hh + ' h ' : '') + String(mm).padStart(hh ? 2 : 1, '0') + ' min', lines: [
    'Calcul : ' + fmt(b) + ' bar × ' + vb + ' L ÷ ' + fmt(d) + ' L/min = ' + fmt(b * vb / d) + ' min, − 10 % = ' + fmt(min) + ' min'] };
});
}
